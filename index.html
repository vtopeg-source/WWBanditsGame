<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бандиты Дикого Запада</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #fdf6e3;
        --text-color: #5D4037;
        --card-bg: #fff8e1;
        --card-border: #8B4513;
        --button-bg: #cd853f;
        --button-text: #fff8e1;
        --button-border-top: #e0ac69;
        --button-border-bottom: #804a1b;
        --stats-bg: #DEB887;
        --primary-button-bg: #8b4513;
        --danger-button-bg: #a54444;
        --input-bg: #fff8e1;
        --scroll-track: #fdf6e3;
        --scroll-thumb: #8B4513;
        --scroll-border: #fdf6e3;
        --heist-overlay: rgba(50,50,50,0.7);
      }

      body.dark-theme {
        --bg-color: #1a120b;
        --text-color: #e2d1b3;
        --card-bg: #2c1e14;
        --card-border: #5d4037;
        --button-bg: #6b4f2c;
        --button-text: #e2d1b3;
        --button-border-top: #896a43;
        --button-border-bottom: #4d381c;
        --stats-bg: #3d2b1f;
        --primary-button-bg: #744315;
        --danger-button-bg: #632a2a;
        --input-bg: #2c1e14;
        --scroll-track: #1a120b;
        --scroll-thumb: #5d4037;
        --scroll-border: #1a120b;
        --heist-overlay: rgba(0,0,0,0.85);
      }

      body {
        margin: 0;
        font-family: 'Merriweather', serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      #root {
        padding: 16px;
        max-width: 400px;
        margin: auto;
        background-color: transparent;
        min-height: 100vh;
        box-sizing: border-box;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Rye', cursive;
      }
      .custom-scroll {
        -webkit-overflow-scrolling: touch;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: var(--scroll-track);
        border-radius: 10px;
        border: 1px solid var(--card-border);
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: var(--scroll-thumb);
        border-radius: 10px;
        border: 2px solid var(--scroll-border);
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background-color: #A0522D;
      }
      
      .tooltip-container {
        position: relative;
        display: inline-block;
        cursor: help;
      }

      .tooltip-container .tooltip-text {
        visibility: hidden;
        width: 160px;
        background-color: var(--text-color);
        color: var(--bg-color);
        text-align: center;
        border-radius: 6px;
        padding: 8px;
        position: absolute;
        z-index: 100;
        bottom: 125%;
        left: 50%;
        margin-left: -80px;
        opacity: 0;
        transition: opacity 0.3s;
        font-family: 'Merriweather', serif;
        font-size: 12px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }

      .tooltip-container .tooltip-text::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: var(--text-color) transparent transparent transparent;
      }

      .tooltip-container:hover .tooltip-text {
        visibility: visible;
        opacity: 1;
      }

      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes burstIn {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      .animate-slide-in { animation: slideInRight 0.5s forwards; }
      .animate-burst-in { animation: burstIn 0.5s forwards; }
      .animate-shake { animation: shake 0.5s forwards; }
      .animate-fade-out { animation: fadeOut 0.5s forwards; }

    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@^18.2.0/",
    "react/": "https://esm.sh/react@^18.2.0/",
    "path": "https://esm.sh/path@^0.12.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>

</head>

    <div id="root"></div>

  </body>
</html>
